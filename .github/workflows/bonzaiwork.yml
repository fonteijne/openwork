name: BonzaiWork

# BonzaiWork's own CI (docs/bonzaiwork/README.md, "CI"): typecheck of what we
# build on, our unit tests, the engine end-to-end check of the LiteLLM-only
# policy, and a packaged Linux build that starts and answers one chat turn.
#
# Runs once per change, not once per branch it passes through:
# - every push to a PR that is ready for review (drafts wait until "Ready for
#   review"), including the upstream-sync/<tag> PRs;
# - pushes to nightly, the commit that gets promoted.
# Not on pushes to main: main only fast-forwards to a nightly commit that ran
# here already. Not on pushes to PR branches: the PR run covers them. A change
# that only touches documentation skips the jobs (scripts/bonzaiwork/ci-scope.mjs).

on:
  push:
    branches: [nightly]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: bonzaiwork-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    # A skipped job counts as passed for required checks, so drafts and docs-only changes still merge.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/bonzaiwork/ci-scope.mjs "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  checks:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # check-patches.mjs diffs against the upstream commit in bonzaiwork.upstream.json.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openwork/types build

      - name: Typecheck (upstream surfaces we patch or import, and our code)
        run: |
          pnpm --filter openwork-server typecheck
          pnpm --filter @openwork/app typecheck
          pnpm --filter @bonzaiwork/policy typecheck
          pnpm --filter @bonzaiwork/litellm typecheck
          pnpm --filter @bonzaiwork/brains typecheck
          pnpm --filter @bonzaiwork/routines typecheck
          pnpm --filter @bonzaiwork/agenda typecheck
          pnpm --filter @bonzaiwork/server-hooks typecheck
          pnpm --filter @bonzaiwork/feedback typecheck
          pnpm --filter @bonzaiwork/app typecheck

      - name: Unit tests
        run: |
          pnpm --filter @bonzaiwork/policy test
          pnpm --filter @bonzaiwork/litellm test
          pnpm --filter @bonzaiwork/brains test
          pnpm --filter @bonzaiwork/routines test
          pnpm --filter @bonzaiwork/agenda test
          pnpm --filter @bonzaiwork/server-hooks test
          pnpm --filter @bonzaiwork/feedback test
          pnpm --filter @bonzaiwork/app test
          cd apps/server && bun test test/downstream-hooks.test.ts

      - name: Engine end-to-end (LiteLLM-only, per-workspace keys, no key leaks)
        run: pnpm --filter @bonzaiwork/litellm e2e

      - name: Engine end-to-end (brains - clone, turn shared, git blocked, trust)
        run: pnpm --filter @bonzaiwork/brains e2e

      - name: Brains on the git the app ships (fetched, checksum checked, pruned)
        run: |
          node scripts/bonzaiwork/fetch-git.mjs
          cd packages/bonzaiwork-brains
          BONZAIWORK_GIT_DIRECTORY="$GITHUB_WORKSPACE/apps/bonzaiwork/resources/git" bun test test/sync.test.ts test/okf.test.ts test/personal.test.ts
          BONZAIWORK_GIT_DIRECTORY="$GITHUB_WORKSPACE/apps/bonzaiwork/resources/git" pnpm e2e

      - name: PATCHES.md lists every changed upstream file
        run: node scripts/bonzaiwork/check-patches.mjs

  package-linux:
    needs: [scope, checks]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: pnpm install --frozen-lockfile
      - name: Package (unpacked Linux app)
        env:
          # The smoke test's stand-in LiteLLM; real builds bake the customer's URL (O3).
          BONZAIWORK_LITELLM_BASE_URL: http://127.0.0.1:4010
        run: node apps/bonzaiwork/scripts/package.mjs --dir --linux
      - name: Smoke test (starts, links a key, one chat turn via LiteLLM, no openworklabs.com traffic)
        run: xvfb-run -a node apps/bonzaiwork/scripts/smoke-packaged.mjs
      - name: Keep smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonzaiwork-smoke
          path: apps/bonzaiwork/dist-electron/*.png
          if-no-files-found: ignore
