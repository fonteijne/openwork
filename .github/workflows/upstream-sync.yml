name: Upstream sync

# Pull-only sync with upstream OpenWork (docs/bonzaiwork/README.md, "Upstream
# automatisch syncen"):
#   1. fast-forwards our dev to different-ai/openwork dev (a mirror for reference;
#      never forced, never our commits),
#   2. keeps upstream's workflows off in the fork (scripts/bonzaiwork/fork-workflows.mjs),
#   3. merges upstream's latest release (not dev: it moves too fast to review)
#      into an upstream-sync/<tag> branch from main and opens a PR to main with a
#      report of what must change before the merge. Merging stays a person's call;
#      a scheduled Claude session reviews open sync PRs (README, "Beoordeling").
# One sync PR at a time: while one is open, runs only fast-forward dev and note
# on that PR when a newer release is out.
#
# Secret UPSTREAM_SYNC_TOKEN (fine-grained PAT on this repo: Contents, Pull
# requests and Workflows read/write) is needed because upstream changes workflow
# files, which GITHUB_TOKEN may not push, and because PRs opened with
# GITHUB_TOKEN do not start the BonzaiWork CI.

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to sync (empty: the latest release)"
        required: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  UPSTREAM_REPO: different-ai/openwork
  UPSTREAM_BRANCH: dev

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      # Every gh command targets this repo. Without it gh prefers the "upstream"
      # remote added below, and PRs or comments could land on different-ai/openwork.
      GH_REPO: ${{ github.repository }}
      HAS_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if [ "$HAS_SYNC_TOKEN" != "true" ]; then
            echo "::warning::UPSTREAM_SYNC_TOKEN is not set: pushes that change workflow files fail and the sync PR gets no CI run."
          fi

      - name: Keep upstream workflows off
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bonzaiwork/fork-workflows.mjs --report "$RUNNER_TEMP/disabled.txt"

      - name: Fast-forward dev to upstream dev
        id: mirror
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git fetch --no-tags origin dev
          head=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse origin/dev)" = "$head" ]; then
            echo "dev is already at upstream $head"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/dev "$head"; then
            echo "::error::origin/dev has commits that upstream $UPSTREAM_BRANCH does not. dev is a pure mirror (README, \"Branches\"): move those commits to a feature branch and reset dev to upstream by hand."
            exit 1
          fi
          # No --force: a push that is not a fast-forward is refused.
          if ! git push origin "$head:refs/heads/dev"; then
            echo "::error::Pushing dev failed. When upstream changed .github/workflows, the token needs the Workflows permission (UPSTREAM_SYNC_TOKEN)."
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Cancel upstream workflow runs started by the dev push
        if: steps.mirror.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Runs show up a few seconds after the push; workflows new in this push register then too.
          sleep 30
          node scripts/bonzaiwork/fork-workflows.mjs --cancel-sha "${{ steps.mirror.outputs.head }}" --report "$RUNNER_TEMP/disabled.txt"

      - name: Find the upstream release
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # releases/latest skips drafts and pre-releases. A bare tag is not enough:
          # upstream tags before its release build has passed.
          tag=${REQUESTED_TAG:-$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)}
          # The tag ends up in branch names and later run: scripts; accept plain versions only.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected upstream release tag '$tag'"
            exit 1
          fi
          git fetch --no-tags upstream "refs/tags/$tag:refs/tags/$tag"
          sha=$(git rev-parse "refs/tags/$tag^{commit}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream release: $tag (${sha:0:9})" >> "$GITHUB_STEP_SUMMARY"

      - name: Find an open sync PR
        id: open
        run: |
          gh pr list --base main --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("upstream-sync/"))][0] // empty | "number=\(.number)\nbranch=\(.headRefName)"' \
            >> "$GITHUB_OUTPUT"

      - name: Note a newer release on the open sync PR
        if: steps.open.outputs.number != ''
        run: |
          set -euo pipefail
          pr=${{ steps.open.outputs.number }}
          tag=${{ steps.release.outputs.tag }}
          echo "Sync PR #$pr is still open; dev was fast-forwarded only." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.open.outputs.branch }}" = "upstream-sync/$tag" ]; then
            exit 0
          fi
          body=$(printf '%s\n' \
            "Upstream heeft intussen [\`$tag\`](https://github.com/$UPSTREAM_REPO/releases/tag/$tag) uitgebracht ($(date -u +%Y-%m-%d))." \
            "" \
            "Deze PR wordt niet automatisch bijgewerkt. Merge of sluit hem; de eerstvolgende run maakt dan een sync-PR voor de nieuwste release.")
          # One running comment instead of one per day.
          gh pr comment "$pr" --edit-last --body "$body" 2>/dev/null || gh pr comment "$pr" --body "$body"

      - name: Merge the release into a sync branch from main
        id: prepare
        if: steps.open.outputs.number == ''
        run: |
          set -euo pipefail
          tag=${{ steps.release.outputs.tag }}
          sha=${{ steps.release.outputs.sha }}
          base=$(node -p 'JSON.parse(require("fs").readFileSync("bonzaiwork.upstream.json", "utf8")).commit')
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$sha" HEAD; then
            echo "main already contains $tag" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="upstream-sync/$tag"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            # A closed sync PR leaves its branch: that release was turned down, don't offer it again daily.
            echo "$branch already exists; delete it to sync $tag again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"

          : > "$RUNNER_TEMP/conflicts.txt"
          if ! git merge --no-ff --no-edit -m "Merge upstream $tag into main" "$sha"; then
            git diff --name-only --diff-filter=U | grep -vx pnpm-lock.yaml > "$RUNNER_TEMP/conflicts.txt" || true
            if [ -s "$RUNNER_TEMP/conflicts.txt" ]; then
              # Not ours to resolve unattended: open the PR from the release itself so GitHub shows the conflicts.
              git merge --abort
              git reset --hard "$sha"
              echo "conflicts=true" >> "$GITHUB_OUTPUT"
              git push origin "HEAD:refs/heads/$branch"
              exit 0
            fi
            # Only the lockfile: regenerated below, never merged by hand (PATCHES.md).
            git checkout --theirs pnpm-lock.yaml
            git add pnpm-lock.yaml
            git commit --no-edit
          fi

          node -e '
            const fs = require("fs");
            const file = "bonzaiwork.upstream.json";
            const pin = JSON.parse(fs.readFileSync(file, "utf8"));
            pin.ref = `${process.argv[1]} (synced ${new Date().toISOString().slice(0, 10)})`;
            pin.commit = process.argv[2];
            fs.writeFileSync(file, `${JSON.stringify(pin, null, 2)}\n`);
          ' "$tag" "$sha"
          pnpm install --lockfile-only --ignore-scripts
          git add bonzaiwork.upstream.json pnpm-lock.yaml
          git commit -m "chore(bonzaiwork): pin upstream $tag"

          set +e
          node scripts/bonzaiwork/check-patches.mjs > "$RUNNER_TEMP/patches.txt" 2>&1
          echo "patches_exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          git push origin "HEAD:refs/heads/$branch"

      - name: Open the sync PR
        id: pr
        if: steps.prepare.outputs.branch != ''
        run: |
          set -euo pipefail
          # Never a PR to upstream: this fork only pulls.
          if [ "$GH_REPO" = "$UPSTREAM_REPO" ]; then
            echo "::error::Refusing to open a PR on $UPSTREAM_REPO"
            exit 1
          fi
          tag=${{ steps.release.outputs.tag }}
          sha=${{ steps.release.outputs.sha }}
          node scripts/bonzaiwork/upstream-sync-report.mjs \
            --base "${{ steps.prepare.outputs.base }}" --head "$sha" --tag "$tag" --upstream "$UPSTREAM_REPO" \
            --conflicts "$RUNNER_TEMP/conflicts.txt" \
            --patches "$RUNNER_TEMP/patches.txt" --patches-exit "${{ steps.prepare.outputs.patches_exit }}" \
            --disabled "$RUNNER_TEMP/disabled.txt" > "$RUNNER_TEMP/body.md"
          count=$(git rev-list --count --no-merges "${{ steps.prepare.outputs.base }}..$sha")
          draft=()
          if [ "${{ steps.prepare.outputs.conflicts }}" = "true" ] || [ "${{ steps.prepare.outputs.patches_exit }}" != "0" ]; then draft=(--draft); fi
          url=$(gh pr create --repo "$GH_REPO" --base main --head "${{ steps.prepare.outputs.branch }}" "${draft[@]}" \
            --title "Upstream-sync: $tag ($count commits)" \
            --body-file "$RUNNER_TEMP/body.md")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
