<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="BonzaiWork: je projecten, chats en routines met AI op één plek." />
    <meta name="theme-color" content="#f2e9e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#232323" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>BonzaiWork</title>
    <script>(function(){try{var p=localStorage.getItem("bonzaiwork.theme");var d=p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);var r=document.documentElement;r.dataset.theme=d?"dark":"light";r.style.colorScheme=d?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}})();</script>
  </head>
  <body>
    <div id="root">
      <!-- Same markup as ShellSkeleton in src/app.tsx: paints before any script runs. -->
      <div class="flex h-dvh bg-background" aria-busy="true" aria-label="Verbinden met je werkplek">
        <div class="hidden w-[264px] flex-col gap-3 border-e border-border bg-sidebar p-3 lg:flex">
          <div class="flex h-8 items-center gap-2 px-1"><svg viewBox="0 0 32 32" aria-hidden="true" class="size-6 shrink-0"><rect width="32" height="32" rx="8" fill="var(--primary)" /><g fill="var(--primary-foreground)"><ellipse cx="11" cy="12" rx="5.2" ry="2.9" /><ellipse cx="20.5" cy="9" rx="5.6" ry="3" /><ellipse cx="21.5" cy="15.5" rx="3.8" ry="2.2" /><path d="M15.2 22.5c.3-2.6-1.6-3.9-1.4-6.1.1-1.3 1.4-2.3 2.9-3.1l.9 1.1c-1.1.6-2 1.3-2.1 2.1-.1 1.5 1.6 3 1.3 6z" /><path d="M9 22.5h14l-1.6 4.2c-.2.5-.6.8-1.1.8h-8.6c-.5 0-.9-.3-1.1-.8z" /></g></svg><span class="text-sm font-semibold text-foreground">BonzaiWork</span></div>
          <span aria-hidden="true" class="block animate-pulse rounded-md bg-muted mt-3 h-7 w-full"></span>
          <span aria-hidden="true" class="block animate-pulse rounded-md bg-muted h-7 w-full"></span>
          <span aria-hidden="true" class="block animate-pulse rounded-md bg-muted h-7 w-4/5"></span>
        </div>
        <div class="flex flex-1 flex-col">
          <div class="flex h-12 shrink-0 items-center gap-2 border-b border-border px-3 lg:px-4"><svg viewBox="0 0 32 32" aria-hidden="true" class="size-6 shrink-0 lg:hidden"><rect width="32" height="32" rx="8" fill="var(--primary)" /><g fill="var(--primary-foreground)"><ellipse cx="11" cy="12" rx="5.2" ry="2.9" /><ellipse cx="20.5" cy="9" rx="5.6" ry="3" /><ellipse cx="21.5" cy="15.5" rx="3.8" ry="2.2" /><path d="M15.2 22.5c.3-2.6-1.6-3.9-1.4-6.1.1-1.3 1.4-2.3 2.9-3.1l.9 1.1c-1.1.6-2 1.3-2.1 2.1-.1 1.5 1.6 3 1.3 6z" /><path d="M9 22.5h14l-1.6 4.2c-.2.5-.6.8-1.1.8h-8.6c-.5 0-.9-.3-1.1-.8z" /></g></svg><span class="text-sm font-semibold text-foreground lg:hidden">BonzaiWork</span></div>
          <div class="mx-auto mt-10 flex w-full max-w-4xl flex-col gap-4 px-6">
            <span aria-hidden="true" class="block animate-pulse rounded-md bg-muted h-8 w-full"></span>
            <span aria-hidden="true" class="block animate-pulse rounded-md bg-muted h-14 w-full"></span>
            <span aria-hidden="true" class="block animate-pulse rounded-md bg-muted h-14 w-full"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
